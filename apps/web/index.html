<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      (() => {
        try {
          const stored = localStorage.getItem('cairn.theme');
          const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) document.documentElement.classList.add('dark');
        } catch {
          // Storage unavailable: the app applies the system theme on load.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
