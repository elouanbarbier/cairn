name: Release Please

# On every push to main, release-please keeps a release pull request up to date (version and CHANGELOG from
# Conventional Commits). Merging it tags the release, publishes it on GitHub, then builds the image.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with the workflow's own token starts no other workflow, so the image is built from here.
  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
