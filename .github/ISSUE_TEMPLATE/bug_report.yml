name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security issue, please use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Press S on a topic
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cairn version
      description: Shown at the bottom of Settings, or returned by `/api/health`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Cairn runs
      options:
        - Docker, published image
        - Docker, built from source
        - From source (pnpm)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host and browser
      placeholder: Raspberry Pi 4 (64-bit), Firefox 140 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs come from `docker compose logs cairn`. Remove anything private first.
